name: CI

on:
  # Only the trunk needs a push trigger; work on a branch is covered by the
  # pull_request event, so this does not build every commit twice.
  push:
    branches: [master]
  pull_request:

# Superseded runs for the same branch are pointless once a newer commit
# exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest
